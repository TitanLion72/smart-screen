<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════════════════
  SÖZLEŞME — smart-screen tray flyout (340×420, çerçevesiz, scroll yok)
  ══════════════════════════════════════════════════════════════════════════
  Biçim: #id | tür | amaç | etkileşim / beklenti

  #fx-dot        | span.dot   | durum noktası (title = tema adı)           | —
  #fx-mode       | span.badge | kip rozeti (Oto/Işık/Saat/Sabit)           | text
  #fx-close      | button     | × kapat (aria-label "Kapat")               | click → invoke("flyout_hide")
  #fx-bright     | div        | büyük yüzde ("%72", bilinmiyorsa "%-")     | text
  #fx-bright-sub | div        | "hedef %70" / "hedef yok"                  | text
  #fx-minus      | button     | −10 (aria-label "Parlaklığı 10 azalt")     | click → brightness_set yolu, 0-100 kelepçe
  #fx-slider     | input range| parlaklık 0-100 (aria-label "Parlaklık")   | input → anlık yüzde metni; change → invoke("brightness_set", { value: Math.round })
  #fx-plus       | button     | +10 (aria-label "Parlaklığı 10 artır")     | click → aynı yazma yolu
  #fx-measure    | button     | "Şimdi yeniden ayarla"                     | click → emit("ss:action", { action: "measure" }) + invoke("flyout_hide")
  #fx-pause      | button     | "Duraklat (1 saat)" / "Devam et (47 dk)"    | click → emit("ss:action", { action: "pause-1h" }); aria-pressed + .active
  #fx-dayoff     | button     | "Bugün"                                     | click → emit("ss:action", { action: "day-off" }); aria-pressed + .active
  #fx-lock       | button     | "Kilitle"                                   | click → emit("ss:action", { action: "lock" }); aria-pressed + .active
  #fx-error      | div        | tek satır hata (3 sn sonra gizlenir)       | text + hidden; role="status"
  #fx-hdr        | div        | "HDR açıkken ekran sarılaştırılamıyor"      | hidden = !hdr; hata olursa kalıcı gizli
  #fx-settings   | button     | "Ayarlar →"                                | click → emit("ss:action", { action: "open-main" }) + invoke("flyout_hide")
  #fx-version    | div        | "v2.1.0"                                   | text; invoke("app_version") yoksa "v2.1"

  BACKEND SÖZLEŞMESİ (src/flyout.ts buna göre bağlanır):
  - invoke("brightness_get") -> number · invoke("brightness_set", { value })
  - invoke("hdr_status") -> boolean · invoke("app_version") -> string (opsiyonel)
  - invoke("flyout_hide") -> pencereyi backend gizler (UI kendini gizlemez)
  - emit("ss:action", { action })  action ∈ measure | pause-1h | day-off |
    lock | open-main
  - listen("ss:state") -> { brightness, theme, mode, pausedUntil, licensed,
    hdr, locked?, dayOff?, target?|targetPct? }
    pausedUntil: epoch ms (veya saniye / ISO string — UI üçünü de kabul eder)
  ══════════════════════════════════════════════════════════════════════════
-->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smart-screen — hızlı panel</title>
    <link rel="stylesheet" href="/src/flyout.css" />
    <link rel="stylesheet" href="/src/toast.css" />
    <script type="module" src="/src/flyout.ts" defer></script>
  </head>

  <body>
    <div class="fx" role="dialog" aria-label="Hızlı panel">
      <!-- 1. Başlık şeridi -->
      <header class="fx-head">
        <span class="fx-brand">
          <span class="dot accent" id="fx-dot"></span>
          <span class="fx-title">smart-screen</span>
        </span>
        <span class="spacer"></span>
        <span class="badge info" id="fx-mode">Oto</span>
        <button type="button" id="fx-close" class="fx-close" aria-label="Kapat">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
          </svg>
        </button>
      </header>

      <!-- 2. Parlaklık bloğu -->
      <section class="fx-bright-card" aria-label="Parlaklık">
        <div class="fx-bright" id="fx-bright">%-</div>
        <div class="fx-bright-sub" id="fx-bright-sub">hedef yok</div>
        <div class="fx-slider-row">
          <button type="button" id="fx-minus" class="fx-step" aria-label="Parlaklığı 10 azalt">−</button>
          <input id="fx-slider" type="range" min="0" max="100" step="1" value="0" aria-label="Parlaklık" />
          <button type="button" id="fx-plus" class="fx-step" aria-label="Parlaklığı 10 artır">+</button>
        </div>
      </section>

      <!-- 3. Hızlı eylemler (2×2) -->
      <div class="fx-actions" role="group" aria-label="Hızlı eylemler">
        <button type="button" id="fx-measure" class="btn-primary">Şimdi yeniden ayarla</button>
        <button type="button" id="fx-pause" class="btn-toggle" aria-pressed="false">Duraklat (1 saat)</button>
        <button type="button" id="fx-dayoff" class="btn-toggle" aria-pressed="false">Bugün</button>
        <button type="button" id="fx-lock" class="btn-toggle" aria-pressed="false">Kilitle</button>
      </div>

      <!-- Hata: tek satır, sessiz yutma yok -->
      <div class="fx-error" id="fx-error" role="status" hidden></div>

      <!-- 4. Alt satır -->
      <div class="fx-foot">
        <div class="fx-hdr" id="fx-hdr" hidden>HDR açıkken ekran sarılaştırılamıyor</div>
        <span class="spacer"></span>
        <button type="button" id="fx-settings" class="linklike">Ayarlar →</button>
      </div>

      <!-- 5. Sürüm -->
      <div class="fx-version" id="fx-version">v2.2.0</div>
    </div>
  </body>
</html>
